<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#1e1b18">
  <title>Calca Casera</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    :root { --bg:#1e1b18; --panel:rgba(20,18,16,.82); --fg:#f4efe9; --accent:#e08a3c; }
    * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    html,body { margin:0; height:100%; background:var(--bg); color:var(--fg);
      font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; overflow:hidden; touch-action:none; }
    #stage { position:fixed; inset:0; overflow:hidden; background:#000; }
    #stage.lightbox { background:#fff; }
    video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; }
    #overlay { position:absolute; left:50%; top:50%; transform-origin:center center;
      max-width:none; user-select:none; -webkit-user-drag:none; pointer-events:none; }
    #hint { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center;
      justify-content:center; text-align:center; padding:24px; gap:16px; }
    #hint h1 { margin:0; font-size:28px; }
    #hint p { margin:0; opacity:.8; max-width:360px; line-height:1.4; }
    .bar { position:fixed; left:0; right:0; display:flex; gap:8px; padding:10px 12px;
      background:var(--panel); backdrop-filter:blur(8px); align-items:center; z-index:2; }
    #top { top:0; padding-top:max(10px, env(safe-area-inset-top)); justify-content:space-between; flex-wrap:wrap; }
    #bottom { bottom:0; padding-bottom:max(10px, env(safe-area-inset-bottom)); flex-direction:column; align-items:stretch; }
    button, label.btn { appearance:none; border:0; border-radius:12px; padding:10px 12px;
      background:rgba(255,255,255,.12); color:var(--fg); font-size:14px; cursor:pointer;
      display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
    button.on { background:var(--accent); color:#1e1b18; }
    .primary { background:var(--accent); color:#1e1b18; font-weight:600; font-size:16px; padding:14px 20px; }
    .row { display:flex; gap:10px; align-items:center; }
    .row label { font-size:13px; min-width:76px; opacity:.85; }
    input[type=range] { flex:1; accent-color:var(--accent); }
    input[type=file] { display:none; }
    .hidden { display:none !important; }
    body.locked .bar:not(.keep) { opacity:.15; }
    body.locked .bar:not(.keep) * { pointer-events:none; }
    #lockBtn { position:fixed; right:12px; bottom:calc(150px + env(safe-area-inset-bottom)); z-index:3;
      width:52px; height:52px; border-radius:50%; justify-content:center; font-size:22px; background:var(--panel); }
    #lockBtn.on { background:var(--accent); }
    #search { position:fixed; inset:0; z-index:5; background:var(--bg); display:flex; flex-direction:column;
      padding-top:env(safe-area-inset-top); }
    .search-head { padding:12px; display:flex; flex-direction:column; gap:10px; border-bottom:1px solid rgba(255,255,255,.1); }
    .row.wrap { flex-wrap:wrap; }
    #q { flex:1; min-width:0; font-size:16px; padding:10px 12px; border-radius:12px; border:0;
      background:rgba(255,255,255,.12); color:var(--fg); }
    .check { display:inline-flex; align-items:center; gap:6px; font-size:14px; }
    .check input { accent-color:var(--accent); width:18px; height:18px; }
    #resultsWrap { flex:1; overflow-y:auto; touch-action:pan-y; padding:12px;
      padding-bottom:max(12px, env(safe-area-inset-bottom)); }
    #results { display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:8px; }
    .result { padding:0; aspect-ratio:1; overflow:hidden; background:#fff; border-radius:10px; }
    .result img { width:100%; height:100%; object-fit:contain; }
    #status { opacity:.7; font-size:14px; line-height:1.4; text-align:center; }
    #more, #googleInline { display:block; margin:12px auto; white-space:normal; text-align:center; }
    #googleInline { font-size:15px; max-width:340px; }
    #hint .primary { min-width:220px; justify-content:center; }
    #toast { position:fixed; left:50%; top:50%; transform:translate(-50%,-50%); background:var(--panel);
      padding:10px 16px; border-radius:12px; z-index:4; transition:opacity .3s; pointer-events:none; }
  </style>
</head>
<body>
  <div id="stage">
    <video id="video" playsinline muted autoplay></video>
    <img id="overlay" class="hidden" alt="">
    <div id="hint">
      <h1>✏️ Calca Casera</h1>
      <p>Elige una imagen, apoya el móvil sobre un vaso o soporte por encima del papel y calca lo que ves en pantalla.</p>
      <label class="btn primary" for="file">📷 De la galería</label>
      <button id="hintSearch" class="primary">🔎 Buscar en internet</button>
    </div>
  </div>

  <div id="top" class="bar hidden">
    <label class="btn" for="file">🖼️ Galería</label>
    <button id="searchBtn" title="Buscar imágenes en internet">🔎</button>
    <button id="modeBtn" title="Cambiar entre cámara y modo calco directo">🎥 Cámara</button>
    <button id="torchBtn" class="hidden">🔦</button>
    <button id="flipBtn" title="Espejo">↔️</button>
    <button id="sketchBtn" title="Convertir a líneas">✏️ Líneas</button>
    <button id="resetBtn" title="Recolocar">⟲</button>
  </div>

  <div id="bottom" class="bar hidden">
    <div class="row"><label for="opacity">Opacidad</label><input id="opacity" type="range" min="0" max="100" value="50"></div>
    <div class="row"><label for="rotation">Rotación</label><input id="rotation" type="range" min="-180" max="180" value="0"></div>
    <div class="row hidden" id="thresholdRow"><label for="threshold">Detalle</label><input id="threshold" type="range" min="5" max="120" value="40"></div>
  </div>

  <button id="lockBtn" class="hidden" title="Bloquear para no mover la imagen sin querer">🔓</button>
  <div id="search" class="hidden">
    <div class="search-head">
      <form id="searchForm" class="row">
        <input id="q" type="search" placeholder="¿Qué quieres dibujar? (o pega un enlace)" autocomplete="off" enterkeyhint="search">
        <button type="submit" class="on">Buscar</button>
        <button type="button" id="closeSearch" title="Cerrar">✕</button>
      </form>
      <div class="row wrap">
        <label class="check"><input id="drawingsOnly" type="checkbox" checked> Solo dibujos</label>
        <button id="googleBtn" type="button">Google Imágenes ↗</button>
        <button id="pasteBtn" type="button">📋 Pegar</button>
      </div>
    </div>
    <div id="resultsWrap">
      <div id="results"></div>
      <p id="status">Imágenes de uso libre de Wikimedia Commons y Openverse. Para usar una de Google: mantenla pulsada → «Copiar imagen» y vuelve aquí a pulsar 📋 Pegar.</p>
      <button id="more" class="hidden">Cargar más</button>
      <button id="googleInline" class="hidden primary">¿No es lo que buscas? Búscalo en Google Imágenes ↗</button>
    </div>
  </div>

  <div id="toast" style="opacity:0"></div>
  <input id="file" type="file" accept="image/*">

<script>
const $ = id => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), stage = $('stage');

const state = { x:0, y:0, scale:1, rot:0, flip:false, locked:false, sketch:false,
  mode:'camera', stream:null, torch:false, original:null, wakeLock:null };

function apply() {
  overlay.style.transform =
    `translate(-50%,-50%) translate(${state.x}px,${state.y}px) rotate(${state.rot}deg) scale(${state.flip ? -state.scale : state.scale}, ${state.scale})`;
  overlay.style.opacity = state.mode === 'lightbox' ? 1 : $('opacity').value / 100;
}

function toast(msg) {
  const t = $('toast'); t.textContent = msg; t.style.opacity = 1;
  clearTimeout(toast.t); toast.t = setTimeout(() => t.style.opacity = 0, 1400);
}

function fitImage() {
  const w = overlay.naturalWidth, h = overlay.naturalHeight;
  state.scale = Math.min(innerWidth * .9 / w, innerHeight * .7 / h);
  state.x = state.y = state.rot = 0; $('rotation').value = 0;
  apply();
}

// ---------- Cámara ----------
async function startCamera() {
  // Evita abrir dos cámaras a la vez si se pulsa varias veces mientras se pide permiso
  if (state.stream || state.starting) return;
  state.starting = true;
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode:{ ideal:'environment' }, width:{ ideal:1920 }, height:{ ideal:1080 } }, audio:false });
    // Si mientras tanto se cambió a calco directo, no dejar la cámara encendida
    if (state.mode !== 'camera') { stream.getTracks().forEach(t => t.stop()); return; }
    state.stream = stream;
    video.srcObject = stream;
    const track = stream.getVideoTracks()[0];
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    $('torchBtn').classList.toggle('hidden', !caps.torch);
  } catch (e) {
    if (state.mode === 'camera') {
      toast('Sin cámara: usando modo calco directo');
      setMode('lightbox');
    }
  } finally {
    state.starting = false;
  }
}
function stopCamera() {
  state.torch = false; $('torchBtn').classList.remove('on');
  if (!state.stream) return;
  state.stream.getTracks().forEach(t => t.stop());
  state.stream = null; video.srcObject = null;
}
function setMode(mode) {
  state.mode = mode;
  const lb = mode === 'lightbox';
  stage.classList.toggle('lightbox', lb);
  $('modeBtn').textContent = lb ? '💡 Calco directo' : '🎥 Cámara';
  $('torchBtn').classList.add('hidden');
  if (lb) { stopCamera(); toast('Pon el papel sobre la pantalla'); } else startCamera();
  apply();
}
$('modeBtn').onclick = () => setMode(state.mode === 'camera' ? 'lightbox' : 'camera');
$('torchBtn').onclick = async () => {
  const track = state.stream && state.stream.getVideoTracks()[0];
  if (!track) return;
  state.torch = !state.torch;
  try { await track.applyConstraints({ advanced:[{ torch:state.torch }] }); } catch { state.torch = false; }
  $('torchBtn').classList.toggle('on', state.torch);
};

// ---------- Mantener pantalla encendida ----------
async function keepAwake() {
  try { if ('wakeLock' in navigator && !state.wakeLock) {
    state.wakeLock = await navigator.wakeLock.request('screen');
    state.wakeLock.addEventListener('release', () => state.wakeLock = null);
  } } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !overlay.classList.contains('hidden')) keepAwake();
});

// ---------- Cargar imagen ----------
// Carga una imagen local (blob:) o de internet. Las de internet se piden con CORS para
// que el modo Líneas pueda leer sus píxeles; si el servidor no lo permite, se reintenta sin CORS.
function loadImage(url, cors = !url.startsWith('blob:')) {
  const id = ++state.loadId;
  const img = new Image();
  if (cors) img.crossOrigin = 'anonymous';
  img.onerror = () => {
    if (id !== state.loadId) return;
    if (cors) return loadImage(url, false);
    if (url.startsWith('blob:')) URL.revokeObjectURL(url);
    toast('No se pudo abrir esa imagen');
  };
  img.onload = () => {
    // Si mientras tanto se eligió otra imagen, ignorar esta
    if (id !== state.loadId) { if (url.startsWith('blob:')) URL.revokeObjectURL(url); return; }
    // Liberar la memoria de la imagen anterior
    if (state.original && state.original.src.startsWith('blob:')) URL.revokeObjectURL(state.original.src);
    state.original = img; state.sketch = false;
    $('sketchBtn').classList.remove('on'); $('thresholdRow').classList.add('hidden');
    overlay.onload = fitImage; overlay.src = url;
    overlay.classList.remove('hidden');
    ['hint'].forEach(id => $(id).classList.add('hidden'));
    ['top','bottom','lockBtn'].forEach(id => $(id).classList.remove('hidden'));
    if (state.mode === 'camera') startCamera();
    keepAwake();
  };
  img.src = url;
}
state.loadId = 0;

$('file').onchange = e => {
  const f = e.target.files[0]; if (!f) return;
  loadImage(URL.createObjectURL(f));
  e.target.value = '';
};

// ---------- Buscar en internet ----------
// Se busca a la vez en dos sitios de imágenes de uso libre que no necesitan clave de API:
// Wikimedia Commons y Openverse. Si uno falla o tarda demasiado, se muestran los del otro.
const TIMEOUT = 12000;
const search = { q:'', id:0, ctrl:null, sources:[] };
function openSearch() {
  $('search').classList.remove('hidden');
  setTimeout(() => $('q').focus(), 50);
}
function closeSearch() { $('search').classList.add('hidden'); }
$('searchBtn').onclick = $('hintSearch').onclick = openSearch;
$('closeSearch').onclick = closeSearch;

async function getJSON(url, signal) {
  const res = await fetch(url, { signal });
  if (res.status === 429) throw new Error('busy');
  if (!res.ok) throw new Error('HTTP ' + res.status);
  return res.json();
}
// El autor en Commons viene como HTML: quedarse solo con el texto
function plain(html) {
  const doc = new DOMParser().parseFromString(html || '', 'text/html');
  doc.querySelectorAll('script,style').forEach(el => el.remove());
  return doc.body.textContent.trim();
}

const SOURCES = {
  commons: {
    first: () => ({ offset:0 }),
    async fetch(q, drawings, st, signal) {
      const p = new URLSearchParams({ action:'query', format:'json', origin:'*', generator:'search',
        gsrnamespace:6, gsrlimit:20, gsroffset:st.offset,
        gsrsearch: q + (drawings ? ' filetype:drawing' : ' filetype:bitmap|drawing'),
        prop:'imageinfo', iiprop:'url|extmetadata', iiurlwidth:1280, iiextmetadatafilter:'Artist|LicenseShortName' });
      const data = await getJSON('https://commons.wikimedia.org/w/api.php?' + p, signal);
      const pages = Object.values((data.query && data.query.pages) || {}).sort((a, b) => a.index - b.index);
      st.offset = data.continue ? data.continue.gsroffset : null;
      return { more: st.offset != null, items: pages.filter(pg => pg.imageinfo).map(pg => {
        const ii = pg.imageinfo[0], m = ii.extmetadata || {}, big = ii.thumburl || ii.url;
        return { thumb: big.replace(/\/1280px-/, '/330px-'), url: big, title: pg.title,
          credit: [plain(m.Artist && m.Artist.value), m.LicenseShortName && m.LicenseShortName.value].filter(Boolean).join(' · ') };
      }) };
    },
  },
  openverse: {
    first: () => ({ page:1 }),
    async fetch(q, drawings, st, signal) {
      const p = new URLSearchParams({ q, page:st.page, page_size:20, mature:'false' });
      if (drawings) p.set('category', 'illustration,digitized_artwork');
      const data = await getJSON('https://api.openverse.org/v1/images/?' + p, signal);
      st.page++;
      return { more: st.page <= (data.page_count || 1), items: (data.results || []).map(r => ({
        thumb: r.thumbnail || r.url, url: r.url, title: r.title,
        credit: [r.creator, r.license && ('CC ' + r.license.toUpperCase() + ' ' + (r.license_version || '')).trim()].filter(Boolean).join(' · ') })) };
    },
  },
};

function addResult(r) {
  const b = document.createElement('button');
  b.className = 'result';
  const im = document.createElement('img');
  im.loading = 'lazy'; im.src = r.thumb; im.alt = r.title || '';
  im.onerror = () => b.remove();
  b.append(im);
  b.onclick = () => {
    closeSearch();
    toast('Cargando…');
    loadImage(r.url);
    if (r.credit) setTimeout(() => toast(r.credit), 1500);
  };
  $('results').append(b);
}

// Los bancos de imágenes libres exigen que coincidan todas las palabras, así que se quitan
// las que no describen la imagen («para colorear», «dibujo de»…). Si las había, se buscan dibujos.
const FILLER = /\b(para\s+(colorear|pintar|calcar|dibujar|imprimir)|colorear|calcar|dibujos?|imagen(es)?|im[aá]genes|f[aá]ciles?|bonitos?|de|del|la|el|los|las|un|una|y|con)\b/gi;
const DRAWING_WORDS = /\b(colorear|pintar|calcar|dibujos?|dibujar|silueta|contorno|coloring|drawing|line\s*art|outline)\b/i;
function cleanQuery(q) {
  const clean = q.replace(FILLER, ' ').replace(/\s+/g, ' ').trim();
  return { text: clean || q, drawing: DRAWING_WORDS.test(q) };
}

function googleQuery() {
  const q = $('q').value.trim();
  // Si ya pide un dibujo («para colorear»…), no añadir más palabras
  return DRAWING_WORDS.test(q) || !$('drawingsOnly').checked ? q : q + ' dibujo para calcar';
}
function openGoogle() {
  window.open('https://www.google.com/search?tbm=isch&q=' + encodeURIComponent(googleQuery()), '_blank', 'noopener');
  toast('Mantén pulsada la imagen → Compartir → Calca Casera');
}
$('googleInline').onclick = openGoogle;

async function runSearch(more) {
  if (!more) {
    if (search.ctrl) search.ctrl.abort();
    $('googleInline').classList.add('hidden');
    search.q = $('q').value.trim();
    $('results').replaceChildren();
    search.sources = Object.keys(SOURCES).map(name => ({ name, st:SOURCES[name].first(), more:true }));
    if (!search.q) { $('status').textContent = ''; $('more').classList.add('hidden'); return; }
  }
  const id = ++search.id, ctrl = new AbortController();
  search.ctrl = ctrl;
  const timer = setTimeout(() => ctrl.abort(), TIMEOUT);
  $('status').textContent = 'Buscando…'; $('more').classList.add('hidden'); $('googleInline').classList.add('hidden');
  const query = cleanQuery(search.q);
  const drawings = $('drawingsOnly').checked || query.drawing;
  let found = 0, failed = 0, busy = 0;
  const active = search.sources.filter(s => s.more);
  await Promise.all(active.map(async s => {
    try {
      const res = await SOURCES[s.name].fetch(query.text, drawings, s.st, ctrl.signal);
      if (id !== search.id) return;
      s.more = res.more;
      res.items.forEach(addResult);
      found += res.items.length;
      if (found) $('status').textContent = 'Buscando más…';
    } catch (e) {
      if (e.message === 'busy') busy++; else failed++;
      s.more = false;
    }
  }));
  clearTimeout(timer);
  if (id !== search.id) return;  // Ya hay otra búsqueda en marcha
  const total = $('results').children.length;
  $('more').classList.toggle('hidden', !search.sources.some(s => s.more));
  $('googleInline').classList.remove('hidden');
  if (total) $('status').textContent = '';
  else if (busy) $('status').textContent = 'Demasiadas búsquedas seguidas, espera un minuto.';
  else if (failed === active.length) $('status').textContent = 'Los buscadores no responden. Revisa la conexión o búscalo en Google.';
  else $('status').textContent = 'No hay imágenes de uso libre de esto. Los personajes de dibujos animados ' +
    '(Snoopy, Disney…) casi nunca lo son: búscalos en Google con el botón de abajo.';
}
$('searchForm').onsubmit = e => { e.preventDefault(); $('q').blur(); runSearch(false); };
$('drawingsOnly').onchange = () => runSearch(false);
$('more').onclick = () => runSearch(true);

// Google Imágenes no permite buscar desde otra app, así que se abre en una pestaña:
// allí se mantiene pulsada la imagen → «Copiar imagen» o «Copiar dirección de la imagen» y se pega aquí.
$('googleBtn').onclick = openGoogle;

// Saca la dirección de la imagen de un texto. Los enlaces de Google Imágenes
// (google.com/imgres?imgurl=…) llevan dentro la dirección de la imagen original.
function imageUrlFrom(text) {
  const m = (text || '').match(/https?:\/\/[^\s"'<>]+/i);
  if (!m) return null;
  try {
    const u = new URL(m[0]);
    const inner = u.searchParams.get('imgurl') || u.searchParams.get('mediaurl');
    return inner && /^https?:\/\//i.test(inner) ? inner : u.href;
  } catch { return null; }
}
function loadFromText(text) {
  const t = (text || '').trim();
  if (!/^https?:\/\/\S+$/i.test(t)) return false;
  closeSearch(); toast('Cargando…'); loadImage(imageUrlFrom(t)); return true;
}

// ---------- Recibir desde el menú «Compartir» del móvil ----------
// El service worker guarda lo compartido y abre la app con ?shared=1
async function receiveShare() {
  if (!new URLSearchParams(location.search).has('shared') || !('caches' in window)) return;
  history.replaceState(null, '', location.pathname);
  try {
    const cache = await caches.open('calca-share');
    const file = await cache.match('shared-file');
    const text = await cache.match('shared-text');
    await caches.delete('calca-share');
    if (file) return loadImage(URL.createObjectURL(await file.blob()));
    const url = text && imageUrlFrom(await text.text());
    if (url) { toast('Cargando…'); return loadImage(url); }
    toast('No llegó ninguna imagen');
  } catch {
    toast('No se pudo recibir la imagen');
  }
}
receiveShare();
$('pasteBtn').onclick = async () => {
  try {
    if (navigator.clipboard && navigator.clipboard.read) {
      for (const item of await navigator.clipboard.read()) {
        const type = item.types.find(t => t.startsWith('image/'));
        if (type) { closeSearch(); loadImage(URL.createObjectURL(await item.getType(type))); return; }
      }
    }
    if (navigator.clipboard && navigator.clipboard.readText && loadFromText(await navigator.clipboard.readText())) return;
    toast('No hay ninguna imagen ni enlace copiado');
  } catch {
    toast('Pega el enlace en el cuadro de búsqueda');
  }
};
$('q').addEventListener('input', () => { if (loadFromText($('q').value)) $('q').value = ''; });
// Ctrl+V en el ordenador: pegar una imagen copiada
document.addEventListener('paste', e => {
  const f = [...(e.clipboardData ? e.clipboardData.files : [])].find(f => f.type.startsWith('image/'));
  if (f) { e.preventDefault(); closeSearch(); loadImage(URL.createObjectURL(f)); }
});

// ---------- Modo líneas (detección de bordes Sobel) ----------
function renderSketch() {
  const img = state.original, maxSide = 1600;
  const k = Math.min(1, maxSide / Math.max(img.width, img.height));
  const w = Math.round(img.width * k), h = Math.round(img.height * k);
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const ctx = c.getContext('2d'); ctx.drawImage(img, 0, 0, w, h);
  let src;
  try { src = ctx.getImageData(0, 0, w, h); }
  catch {
    // Algunos navegadores bloquean leer los píxeles de ciertas imágenes (p. ej. SVG)
    toast('Esta imagen no permite el modo Líneas; prueba con otra');
    state.sketch = false;
    $('sketchBtn').classList.remove('on'); $('thresholdRow').classList.add('hidden');
    return;
  }
  const d = src.data;
  const g = new Float32Array(w * h);
  for (let i = 0; i < w * h; i++) g[i] = .299*d[i*4] + .587*d[i*4+1] + .114*d[i*4+2];
  const out = ctx.createImageData(w, h), o = out.data, th = +$('threshold').value;
  for (let y = 1; y < h - 1; y++) for (let x = 1; x < w - 1; x++) {
    const i = y * w + x;
    const gx = -g[i-w-1] - 2*g[i-1] - g[i+w-1] + g[i-w+1] + 2*g[i+1] + g[i+w+1];
    const gy = -g[i-w-1] - 2*g[i-w] - g[i-w+1] + g[i+w-1] + 2*g[i+w] + g[i+w+1];
    const edge = Math.hypot(gx, gy) > th * 4;
    // Líneas negras sobre fondo transparente, para ver el papel a través
    o[i*4] = o[i*4+1] = o[i*4+2] = 0; o[i*4+3] = edge ? 255 : 0;
  }
  ctx.putImageData(out, 0, 0);
  const prevW = overlay.naturalWidth;
  overlay.onload = () => { state.scale *= prevW / overlay.naturalWidth; apply(); };
  overlay.src = c.toDataURL();
}
$('sketchBtn').onclick = () => {
  if (!state.original) return;
  state.sketch = !state.sketch;
  $('sketchBtn').classList.toggle('on', state.sketch);
  $('thresholdRow').classList.toggle('hidden', !state.sketch);
  if (state.sketch) renderSketch();
  else {
    const prevW = overlay.naturalWidth;
    overlay.onload = () => { state.scale *= prevW / overlay.naturalWidth; apply(); };
    overlay.src = state.original.src;
  }
};
let thTimer;
$('threshold').oninput = () => { clearTimeout(thTimer); thTimer = setTimeout(() => { if (state.sketch) renderSketch(); }, 120); };

// ---------- Controles ----------
$('opacity').oninput = apply;
$('rotation').oninput = e => { state.rot = +e.target.value; apply(); };
$('flipBtn').onclick = () => { state.flip = !state.flip; $('flipBtn').classList.toggle('on', state.flip); apply(); };
$('resetBtn').onclick = fitImage;
$('lockBtn').onclick = () => {
  state.locked = !state.locked;
  document.body.classList.toggle('locked', state.locked);
  $('lockBtn').classList.toggle('on', state.locked);
  $('lockBtn').textContent = state.locked ? '🔒' : '🔓';
  toast(state.locked ? 'Imagen bloqueada' : 'Imagen desbloqueada');
};

// ---------- Gestos: arrastrar, pellizcar para zoom y girar ----------
const pointers = new Map();
let gesture = null;
function snapshot() {
  const pts = [...pointers.values()];
  if (pts.length === 1) return { x:pts[0].x, y:pts[0].y };
  const [a, b] = pts;
  return { x:(a.x+b.x)/2, y:(a.y+b.y)/2, dist:Math.hypot(b.x-a.x, b.y-a.y),
    angle:Math.atan2(b.y-a.y, b.x-a.x) * 180 / Math.PI };
}
function begin() {
  gesture = pointers.size ? { start:snapshot(), x:state.x, y:state.y, scale:state.scale, rot:state.rot } : null;
}
stage.addEventListener('pointerdown', e => {
  if (state.locked || overlay.classList.contains('hidden') || pointers.size >= 2) return;
  stage.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY }); begin();
});
stage.addEventListener('pointermove', e => {
  if (!pointers.has(e.pointerId) || !gesture) return;
  pointers.set(e.pointerId, { x:e.clientX, y:e.clientY });
  const now = snapshot(), s = gesture.start;
  state.x = gesture.x + now.x - s.x;
  state.y = gesture.y + now.y - s.y;
  if (now.dist && s.dist) {
    state.scale = Math.max(.02, gesture.scale * now.dist / s.dist);
    state.rot = ((gesture.rot + now.angle - s.angle + 540) % 360) - 180;
    $('rotation').value = Math.round(state.rot);
  }
  apply();
});
['pointerup','pointercancel'].forEach(t => stage.addEventListener(t, e => {
  pointers.delete(e.pointerId); begin();
}));
stage.addEventListener('wheel', e => {
  if (state.locked) return;
  e.preventDefault(); state.scale *= e.deltaY < 0 ? 1.08 : 1/1.08; apply();
}, { passive:false });

addEventListener('resize', apply);

if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
